# 시험용 프록시(호스트 8081). 운영 프록시(infra/nginx/default.conf)와 같은 경로 규칙으로 review 컨테이너에 보낸다.
# 프론트엔드는 업로드한 frontend 폴더를 이 컨테이너가 직접 서빙한다(운영은 aim2day-frontend 컨테이너).
upstream goal_review {
    server aim2day-goal-service-review-1:8080;
    server aim2day-goal-service-review-2:8080;
}

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/  { proxy_pass http://aim2day-user-service-review:8080; }
    location /api/users/ { proxy_pass http://aim2day-user-service-review:8080; }
    location /api/       { proxy_pass http://goal_review; }
    location /           { root /usr/share/nginx/html; index index.html; }
}
