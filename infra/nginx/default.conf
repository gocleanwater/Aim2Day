upstream goal_backend {
    server goal-services:8080;    # 별칭 하나 → Docker DNS가 IP 3개를 돌려줌 → Nginx가 3대로 RR
}

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/  { proxy_pass http://aim2day-user-service:8080; }
    location /api/users/ { proxy_pass http://aim2day-user-service:8080; }
    location /api/       { proxy_pass http://goal_backend; }
    location /           { proxy_pass http://aim2day-frontend:80; }
}
