spring.application.name=user-service
server.port=8080

# 접속 정보(DB URL/계정/비밀번호, Redis 호스트)는 코드에 두지 않는다.
# 실행 시 환경 변수 SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_DATA_REDIS_HOST 로 주입한다(Spring 표준 relaxed binding).

# goal-service와 같은 MySQL DB를 쓰므로 Flyway 이력 테이블을 서비스별로 분리한다.
spring.flyway.table=flyway_user_service_history

# 세션은 Redis에 저장하고 goal-service와 공유한다. 두 서비스의 네임스페이스가 같아야 같은 세션을 읽는다.
spring.session.redis.namespace=spring:session
