spring.application.name=user-service
server.port=8080

# 접속 정보(DB URL/계정/비밀번호, Redis 호스트)는 코드에 두지 않는다.
# 실행 시 환경 변수 SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_DATA_REDIS_HOST 로 주입한다(Spring 표준 relaxed binding).

# goal-service와 같은 MySQL DB를 쓰므로 Flyway 이력 테이블을 서비스별로 분리한다.
spring.flyway.table=flyway_user_service_history

# 세션은 Redis에 저장하고 goal-service와 공유한다. 두 서비스의 네임스페이스가 같아야 같은 세션을 읽는다.
spring.session.redis.namespace=spring:session

# 같은 DB에 다른 서비스의 테이블이 먼저 있어도 이 서비스의 Flyway 이력 테이블을 새로 만들고 진행한다.
# baseline-version=0: 기본값 1이면 첫 마이그레이션(V1)을 이미 적용된 것으로 보고 건너뛴다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 일시는 ISO-8601 UTC(Z)로 직렬화한다(API 명세 §2.3). 숫자 타임스탬프로 내보내지 않는다.
# Boot 4는 Jackson 3이라 spring.jackson.* 중 일부 키가 Jackson 2와 다르다. 실제 동작은 JsonTimeZoneTests로 확인한다.
spring.jackson.time-zone=UTC
# DB 일시 컬럼도 UTC로 읽고 쓴다(JVM 기본 시간대에 따라 값이 달라지는 것을 막는다).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis 세션 네임스페이스는 SessionConfig의 @EnableRedisIndexedHttpSession(redisNamespace)이 실제 값을 정한다.
# 위의 spring.session.redis.namespace는 계약 문서(공유 계약 §4)와 맞추는 표기이며 값이 같아야 한다.

# Swagger UI와 OpenAPI JSON을 /docs/user/ 아래로 옮긴다(공유 계약 §7).
# 프록시가 /docs/user/ 만 이 서비스로 보내므로 UI의 정적 리소스도 이 접두사 아래에서 서빙되어야 한다.
springdoc.api-docs.path=/docs/user/v3/api-docs
springdoc.swagger-ui.path=/docs/user/swagger-ui.html
# Swagger UI가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 자동 전송한다.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
