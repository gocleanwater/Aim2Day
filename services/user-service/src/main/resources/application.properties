spring.application.name=user-service
server.port=8080

# 프록시(Nginx)가 보낸 X-Forwarded-For·X-Forwarded-Proto를 Tomcat이 읽어 실제 접속자 IP와 http/https를 요청 정보에 반영한다.
# 내부망 IP(Docker 네트워크 등)에서 온 헤더만 믿는다. HTTPS를 프록시에 붙이면 세션·CSRF 쿠키의 Secure 판단에 쓰인다.
server.forward-headers-strategy=native

# Boot가 기본 사용자(user)와 "Using generated security password" 로그를 만드는 자동 구성을 끈다.
# 인증은 직접 만든 로그인 API와 세션으로만 하므로 UserDetailsService가 필요 없고,
# 임시 비밀번호가 로그에 남는 것은 비밀값 로그 금지(NFR-010)에도 어긋난다.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# 접속 정보(DB URL/계정/비밀번호, Redis 호스트)는 코드에 두지 않는다.
# 실행 시 환경 변수 SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_DATA_REDIS_HOST 로 주입한다(Spring 표준 relaxed binding).

# goal-service와 같은 MySQL DB를 쓰므로 Flyway 이력 테이블을 서비스별로 분리한다.
spring.flyway.table=flyway_user_service_history

# 세션은 Redis에 저장하고 goal-service와 공유한다. 두 서비스의 네임스페이스가 같아야 같은 세션을 읽는다.
spring.session.redis.namespace=spring:session

# 같은 DB에 다른 서비스의 테이블이 먼저 있어도 이 서비스의 Flyway 이력 테이블을 새로 만들고 진행한다.
# baseline-version=0: 기본값 1이면 첫 마이그레이션(V1)을 이미 적용된 것으로 보고 건너뛴다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 일시는 ISO-8601 UTC(Z)로 직렬화한다(API 명세 §2.3). 숫자 타임스탬프로 내보내지 않는다.
# Boot 4는 Jackson 3이라 spring.jackson.* 중 일부 키가 Jackson 2와 다르다. 실제 동작은 JsonTimeZoneTests로 확인한다.
spring.jackson.time-zone=UTC
# DB 일시 컬럼도 UTC로 읽고 쓴다(JVM 기본 시간대에 따라 값이 달라지는 것을 막는다).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# DB 세션 시간대도 UTC로 고정한다. DB가 기본 시간대(예: KST)로 CURRENT_TIMESTAMP 등을 채우면 Hibernate가 UTC로
# 읽을 때 값이 어긋나므로, MySQL 연결을 맺을 때마다 실행해 서버 설정과 무관하게 UTC를 보장한다.
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Redis 세션 네임스페이스는 SessionConfig의 @EnableRedisIndexedHttpSession(redisNamespace)이 실제 값을 정한다.
# 위의 spring.session.redis.namespace는 계약 문서(공유 계약 §4)와 맞추는 표기이며 값이 같아야 한다.

# Swagger UI와 OpenAPI JSON을 /docs/user/ 아래로 옮긴다(공유 계약 §7).
# 프록시가 /docs/user/ 만 이 서비스로 보내므로 UI의 정적 리소스도 이 접두사 아래에서 서빙되어야 한다.
springdoc.api-docs.path=/docs/user/v3/api-docs
springdoc.swagger-ui.path=/docs/user/swagger-ui.html
# Swagger UI가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 자동 전송한다.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# 스키마는 Flyway만 만든다. Hibernate는 엔티티와 테이블이 맞는지 검증만 한다(공유 계약 §3).
spring.jpa.hibernate.ddl-auto=validate
# 뷰 렌더링용 OSIV는 쓰지 않는다. 트랜잭션은 서비스 계층에서 끝낸다.
spring.jpa.open-in-view=false

# 메일 링크의 앞부분(공유 계약 §2). 환경 변수 APP_BASE_URL로 덮어쓴다.
app.base-url=http://localhost
# SMTP 서버가 응답하지 않을 때 요청 스레드가 무한정 붙잡히지 않도록 제한 시간을 둔다(밀리초).
# spring.mail.host가 없으면(로그 모드) 이 값들은 쓰이지 않는다.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 동시 가입으로 이메일 UNIQUE 제약을 어기면 Hibernate가 JDBC 오류 메시지
# ("Duplicate entry 'user@example.com' ...")를 WARN/ERROR로 남긴다. 이메일 원문은 어떤 로그에도 남기지 않으므로
# 해당 로거를 끈다. 위반은 SignupService가 409로 처리하며 이메일 없이 응답한다.
# Hibernate 7은 이 메시지를 org.hibernate.orm.jdbc.error 로거로 내보내고(실제 로그에서 확인),
# 이전 버전 호환 경로인 SqlExceptionHelper도 함께 끈다.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# 검증 실패(MethodArgumentNotValidException 등)의 메시지에는 FieldError의 "rejected value [...]"로 사용자가 입력한
# 비밀번호·이메일·인증번호·토큰 원문이 그대로 들어간다. DTO의 toString 마스킹은 이 경로(예외 message)에 적용되지 않는다.
# org.springframework.web 로깅을 DEBUG/TRACE로 올리면 아래 두 로거가 그 예외를 통째로 찍는다(실제 로그에서 확인).
#  - ExceptionHandlerExceptionResolver: 예외를 @ExceptionHandler로 처리했다는 DEBUG "Resolved [예외]" 줄
#  - HandlerMethod: 예외 처리 메서드를 호출할 때 인자(= 예외 객체)를 찍는 TRACE "Arguments: [...]" 줄
# 예외 message는 Spring 내부가 만들므로 우리 코드로 가릴 수 없다. 부모 로거(org.springframework.web)보다 구체적인
# 로거에 레벨을 고정하면 부모를 TRACE로 올려도 이 둘은 INFO로 유지되어 원문이 나오지 않는다.
# 응답 처리 결과는 GlobalExceptionHandler가 응답 본문(reason 코드만)으로 알리므로 진단 정보를 잃지 않는다.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
logging.level.org.springframework.web.method.HandlerMethod=INFO
