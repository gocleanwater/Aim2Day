# 이 파일은 classpath:/config/ 아래에 둔다. 같은 이름을 src/test/resources 바로 아래에 두면 main의
# application.properties를 통째로 가려서 springdoc·jackson 같은 운영 설정이 테스트에 적용되지 않는다.
# config/ 아래 파일은 main 설정 위에 덧씌워지므로 아래 값만 테스트용으로 바뀐다.
# 테스트 전용 설정: 외부 MySQL/Redis 없이 contextLoads가 통과하도록 인메모리 H2를 쓴다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Flyway 마이그레이션이 아직 없으므로 테스트에서는 끈다(마이그레이션 추가 시 재검토).
spring.flyway.enabled=false
# 세션 저장소: Redis 빈은 그대로 두고, 테스트 설정(TestSessionConfig)이 메모리 저장소를 @Primary로 덮고 Redis 접속 초기화를 끈다.
