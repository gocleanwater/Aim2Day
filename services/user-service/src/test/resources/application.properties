# 테스트 전용 설정: 외부 MySQL/Redis 없이 contextLoads가 통과하도록 인메모리 H2를 쓴다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Flyway 마이그레이션이 아직 없으므로 테스트에서는 끈다(마이그레이션 추가 시 재검토).
spring.flyway.enabled=false
# 세션 저장소는 Redis 그대로 둔다. Lettuce 연결은 지연 방식이라 contextLoads 단계에서는 Redis에 접속하지 않아 통과한다.
# 세션을 실제로 쓰는 테스트(로그인 등)를 추가할 때 Redis 대체(Testcontainers 등)를 다시 정한다.
