spring.application.name=goal-service
server.port=8080

# 프록시(Nginx)가 보낸 X-Forwarded-For·X-Forwarded-Proto를 Tomcat이 읽어 실제 접속자 IP와 http/https를 요청 정보에 반영한다.
# 내부망 IP(Docker 네트워크 등)에서 온 헤더만 믿는다. HTTPS를 프록시에 붙이면 세션·CSRF 쿠키의 Secure 판단에 쓰인다.
server.forward-headers-strategy=native

# 인증은 user-service가 만든 세션의 userId로만 하므로 UserDetailsService가 필요 없고,
# 임시 비밀번호가 로그에 남는 것은 비밀값 로그 금지(NFR-010)에도 어긋난다.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# 접속 정보는 여기에 적지 않는다. 컨테이너 실행 시 환경 변수로 주입한다.
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, SPRING_DATA_REDIS_HOST
# (Spring Boot의 relaxed binding이 환경 변수를 spring.datasource.* / spring.data.redis.host 로 매핑한다.)

# user-service와 같은 MySQL DB를 공유하므로 Flyway 이력 테이블을 서비스별로 분리한다.
spring.flyway.table=flyway_goal_service_history

# 세션은 Redis에 저장해 3개 인스턴스가 공유한다.
spring.session.redis.namespace=spring:session

# 같은 DB에 다른 서비스의 테이블이 먼저 있어도 이 서비스의 Flyway 이력 테이블을 새로 만들고 진행한다.
# baseline-version=0: 기본값 1이면 첫 마이그레이션(V1)을 이미 적용된 것으로 보고 건너뛴다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 일시는 UTC로 다룬다(API 명세 §2.3). JVM 기본 시간대는 GoalServiceApplication의 static 블록에서 UTC로 고정한다.
# Jackson: 응답 일시를 UTC 기준으로 직렬화(Instant는 ISO-8601 'Z'). Hibernate: DB 저장·조회 시각도 UTC로 변환한다.
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger(공유 계약 §7): 프록시가 /docs/goal/ 만 이 서비스로 보내므로 UI·JSON·정적 리소스를 모두 그 아래에 둔다.
springdoc.api-docs.path=/docs/goal/v3/api-docs
springdoc.swagger-ui.path=/docs/goal/swagger-ui.html
# Swagger UI에서 상태 변경 요청을 보낼 수 있도록 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더에 자동으로 넣는다.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# 스키마는 Flyway만 만든다(공유 계약). Hibernate는 엔티티와 테이블이 맞는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
# 요청 처리가 끝난 뒤 뷰 렌더링 단계에서 지연 로딩으로 DB를 건드리지 않게 한다.
spring.jpa.open-in-view=false

# DB 기본값(CURRENT_TIMESTAMP)이 채우는 created_at·updated_at을 UTC로 맞추려고 커넥션 세션 시간대를 UTC로 고정한다(user-service와 같다).
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# 30일 지난 삭제 목표의 영구 정리 예약 작업(단위 6). 세 인스턴스가 모두 돌리며 중복은 DB 잠금으로 막는다.
# cron(초 분 시 일 월 요일)은 환경 변수 AIM2DAY_TRASH_PURGE_CRON으로 바꾼다. 기본은 매시 정각이다.
# AIM2DAY_TRASH_PURGE_ENABLED=false이면 예약 작업 자체를 끈다(테스트용).
aim2day.trash.purge-enabled=true
aim2day.trash.purge-cron=0 0 * * * *
