spring.application.name=goal-service
server.port=8080

# 접속 정보는 여기에 적지 않는다. 컨테이너 실행 시 환경 변수로 주입한다.
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, SPRING_DATA_REDIS_HOST
# (Spring Boot의 relaxed binding이 환경 변수를 spring.datasource.* / spring.data.redis.host 로 매핑한다.)

# user-service와 같은 MySQL DB를 공유하므로 Flyway 이력 테이블을 서비스별로 분리한다.
spring.flyway.table=flyway_goal_service_history

# 세션은 Redis에 저장해 3개 인스턴스가 공유한다.
spring.session.redis.namespace=spring:session
