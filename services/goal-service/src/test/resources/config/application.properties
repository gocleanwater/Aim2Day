# classpath:/config/ 에 두면 main의 application.properties와 합쳐진다(루트에 같은 이름을 두면 main 설정을 통째로 가린다).
# 테스트 전용 설정: 외부 MySQL/Redis 없이 컨텍스트가 뜨도록 H2 인메모리 DB를 쓴다.
spring.datasource.url=jdbc:h2:mem:goaltest;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
# Redis 연결은 지연(lazy) 방식이라 컨텍스트 로딩 중에는 접속하지 않는다.
spring.data.redis.host=localhost
spring.flyway.locations=classpath:db/migration,classpath:db/test-migration
# main의 MySQL 구문(SET time_zone = ...)은 H2가 거부한다. H2의 같은 목적 구문으로 덮어써 테스트에서도 DB 세션을 UTC로 고정한다.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '+00:00'
