# 테스트 전용 설정: 외부 MySQL/Redis 없이 컨텍스트가 뜨도록 H2 인메모리 DB를 쓴다.
spring.datasource.url=jdbc:h2:mem:goaltest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Redis 연결은 지연(lazy) 방식이라 컨텍스트 로딩 중에는 접속하지 않는다.
spring.data.redis.host=localhost
# 마이그레이션이 아직 없어도 Flyway가 실패하지 않도록 한다.
spring.flyway.fail-on-missing-locations=false
